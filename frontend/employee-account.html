<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Account - Man Hours Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <nav class="navbar">
        <div class="nav-shell">
            <a href="employee-dashboard.html" class="nav-logo">
                <img src="assets/manhour-logo.svg" alt="Manhour logo" class="nav-logo-image" />
                <span class="nav-logo-text">
                    <strong>Manhour</strong>
                    <span>Employee</span>
                </span>
            </a>

            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <div class="nav-menu">
                <a href="employee-dashboard.html" class="nav-item nav-link">Dashboard</a>
                <a href="employee-hours.html" class="nav-item nav-link">Hours Log</a>
                <a href="employee-account.html" class="nav-item nav-link">Account</a>

                <div class="nav-actions">
                    <button id="backBtn" class="nav-btn">BACK</button>
                    <button id="logoutBtn" class="nav-btn">LOGOUT</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-shell">
        <div class="container card employee-shell">
            <header class="page-header">
                <div class="page-header-copy">
                    <span class="eyebrow">Account</span>
                    <h1>View your profile and manage your login.</h1>
                    <p>Your job details come from the admin roster. You can update your email and password here.</p>
                </div>
                <div class="header-chip">
                    <strong id="accountStatusBadge">Approved</strong>
                    <span id="accountStatusText">Your access is active.</span>
                </div>
            </header>

            <section class="panel-card" style="display:block;">
                <form id="accountForm">
                    <div class="form-grid">
                        <div>
                            <label for="name">Full name</label>
                            <input type="text" id="name" name="name" readonly />
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required />
                        </div>
                        <div>
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company" readonly />
                        </div>
                        <div>
                            <label for="role">Role</label>
                            <input type="text" id="role" name="role" readonly />
                        </div>
                        <div>
                            <label for="trade">Trade</label>
                            <input type="text" id="trade" name="trade" readonly />
                        </div>
                        <div></div>
                        <div>
                            <label for="currentPassword">Current password</label>
                            <input type="password" id="currentPassword" name="currentPassword" />
                        </div>
                        <div>
                            <label for="newPassword">New password</label>
                            <input type="password" id="newPassword" name="newPassword" />
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="theme-btn">Save Changes</button>
                    </div>
                </form>
                <p id="accountMsg" class="error" style="display:none;"></p>
            </section>
        </div>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/employee-account.js"></script>
</body>

</html>
